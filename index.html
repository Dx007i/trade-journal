// ============================================================
// CSV 导入
// ============================================================
let csvImportTrades = [];  // 已解析待入库的交易列表

function handleCsvDrop(e) {
  e.preventDefault();
  document.getElementById('csv-drop-zone').classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (files.length > 0) handleCsvFiles(files);
}

function handleCsvFiles(files) {
  const csvFiles = [...files].filter(f => f.name.toLowerCase().endsWith('.csv'));
  if (csvFiles.length === 0) { showToast('请拖入 .csv 文件'); return; }
  let loaded = 0;
  csvFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const date = extractDateFromFilename(file.name);
      const csvText = decodeCsvBuffer(ev.target.result);
      const trades = parseCsvText(csvText, date);
      csvImportTrades = csvImportTrades.concat(trades);
      loaded++;
      if (loaded === csvFiles.length) renderCsvPreview();
    };
    reader.onerror = function() { loaded++; showToast(`读取 ${file.name} 失败`); };
    reader.readAsArrayBuffer(file);
  });
}

// 解码 CSV 文件：自动检测 GBK / UTF-8
function decodeCsvBuffer(buffer) {
  // 先试 UTF-8
  let text = new TextDecoder('utf-8', { fatal: false }).decode(buffer);
  // 检查是否包含预期中文关键字（未被破坏的编码）
  if (/成交时间|操作|买入|卖出|证券/.test(text)) return text;
  // UTF-8 解码后中文乱码，尝试 GBK
  try {
    text = new TextDecoder('gbk', { fatal: false }).decode(buffer);
  } catch(e) {
    // 不支持 GBK 的浏览器，尝试 gb2312
    try { text = new TextDecoder('gb2312', { fatal: false }).decode(buffer); }
    catch(e2) { /* 保持 UTF-8 解码结果 */ }
  }
  return text;
}

function extractDateFromFilename(filename) {
  const m = filename.match(/(\d{4})[^\d]*(\d{2})[^\d]*(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return new Date().toISOString().slice(0, 10);
}

function parseCsvText(csvText, date) {
  // 移除 BOM
  if (csvText.charCodeAt(0) === 0xFEFF) csvText = csvText.slice(1);
  const lines = csvText.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const trades = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const parts = line.split(',');
    if (parts.length < 7) continue;
    let [time, code, name, op, qty, price, amount] = parts;
    time = (time || '').trim();
    code = (code || '').trim();
    name = (name || '').trim().replace(/\s+/g, '');
    op = (op || '').trim();
    qty = parseInt((qty || '0').trim(), 10) || 0;
    amount = parseFloat((amount || '0').trim()) || 0;

    // 均价可能含"（元）"后缀的列名或被污染，统一清洗
    let priceStr = (price || '0').trim();
    priceStr = priceStr.replace(/[^\d.]/g, '');
    const parsedPrice = parseFloat(priceStr) || 0;

    // 操作方向识别: 买入/证券买入/buy → buy; 卖出/证券卖出/sell → sell
    const opLower = op.toLowerCase();
    let direction = 'buy';
    if (opLower.includes('卖') || opLower.includes('sell')) {
      direction = 'sell';
    } else if (opLower.includes('买') || opLower.includes('buy')) {
      direction = 'buy';
    }

    if (!code || qty <= 0) continue;

    const finalAmount = amount || Math.round(parsedPrice * qty * 100) / 100;
    const finalFee = Math.round(finalAmount * 0.0001 * 100) / 100;
    const finalTax = direction === 'sell' ? Math.round(finalAmount * 0.0005 * 100) / 100 : 0;

    trades.push({
      date: date, time: time, code: code, name: name,
      direction: direction, qty: qty, price: parsedPrice,
      amount: finalAmount, fee: finalFee, tax: finalTax,
      _checked: true
    });
  }
  return trades;
}

function renderCsvPreview() {
  const area = document.getElementById('csv-import-area');
  const stats = document.getElementById('csv-import-stats');
  const tbody = document.getElementById('csv-preview-tbody');
  const resultEl = document.getElementById('csv-import-result');
  const dropZone = document.getElementById('csv-drop-zone');

  if (csvImportTrades.length === 0) {
    area.style.display = 'none';
    dropZone.style.display = '';
    return;
  }

  area.style.display = '';
  dropZone.style.display = 'none';
  resultEl.style.display = 'none';

  const checked = csvImportTrades.filter(t => t._checked);
  const totalBuy = checked.filter(t => t.direction === 'buy').reduce((s, t) => s + t.amount, 0);
  const totalSell = checked.filter(t => t.direction === 'sell').reduce((s, t) => s + t.amount, 0);

  stats.innerHTML = `
    <span class="st">共 <b>${csvImportTrades.length}</b> 条</span>
    <span class="st">选中 <b style="color:var(--blue);">${checked.length}</b> 条</span>
    <span class="st">买入 <b style="color:var(--red);">¥${totalBuy.toLocaleString()}</b></span>
    <span class="st">卖出 <b style="color:var(--green);">¥${totalSell.toLocaleString()}</b></span>
  `;

  tbody.innerHTML = csvImportTrades.map((t, idx) => `
    <tr>
      <td class="row-cb"><input type="checkbox" ${t._checked ? 'checked' : ''} onchange="csvTradeToggle(${idx}, this.checked)"></td>
      <td><input type="date" value="${t.date}" onchange="csvTradeEdit(${idx},'date',this.value)"></td>
      <td><input type="text" value="${htmlEscape(t.time)}" onchange="csvTradeEdit(${idx},'time',this.value)" style="min-width:72px;"></td>
      <td><input type="text" value="${htmlEscape(t.code)}" onchange="csvTradeEdit(${idx},'code',this.value)" style="min-width:64px;"></td>
      <td><input type="text" value="${htmlEscape(t.name)}" onchange="csvTradeEdit(${idx},'name',this.value)" style="min-width:80px;"></td>
      <td class="${t.direction === 'buy' ? 'dir-buy' : 'dir-sell'}">
        <select onchange="csvTradeEdit(${idx},'direction',this.value)" style="min-width:60px;">
          <option value="buy" ${t.direction === 'buy' ? 'selected' : ''}>买入</option>
          <option value="sell" ${t.direction === 'sell' ? 'selected' : ''}>卖出</option>
        </select>
      </td>
      <td><input type="number" value="${t.qty}" onchange="csvTradeEditQty(${idx},this.value)" style="min-width:64px;" min="0"></td>
      <td><input type="number" value="${t.price}" onchange="csvTradeEditPrice(${idx},this.value)" style="min-width:72px;" step="0.001"></td>
      <td><input type="number" value="${t.amount}" onchange="csvTradeEdit(${idx},'amount',parseFloat(this.value)||0)" style="min-width:80px;" step="0.01"></td>
      <td><input type="number" value="${t.fee||0}" onchange="csvTradeEdit(${idx},'fee',parseFloat(this.value)||0)" style="min-width:64px;" step="0.01"></td>
      <td><input type="number" value="${t.tax||0}" onchange="csvTradeEdit(${idx},'tax',parseFloat(this.value)||0)" style="min-width:64px;" step="0.01"></td>
      <td class="row-del" onclick="removeCsvTrade(${idx})" title="移除此条">✕</td>
    </tr>
  `).join('');
}

function csvTradeToggle(idx, checked) {
  if (csvImportTrades[idx]) {
    csvImportTrades[idx]._checked = checked;
    renderCsvPreview();
  }
}

function csvTradeEdit(idx, field, value) {
  if (!csvImportTrades[idx]) return;
  csvImportTrades[idx][field] = value;
  if (field === 'direction' || field === 'amount') recalcCsvFeeTax(csvImportTrades[idx]);
  renderCsvPreview();
}

function csvTradeEditQty(idx, val) {
  if (!csvImportTrades[idx]) return;
  const qty = parseInt(val, 10) || 0;
  if (qty <= 0) { showToast('数量必须 > 0'); return; }
  csvImportTrades[idx].qty = qty;
  csvImportTrades[idx].amount = Math.round(qty * csvImportTrades[idx].price * 100) / 100;
  recalcCsvFeeTax(csvImportTrades[idx]);
  renderCsvPreview();
}

function csvTradeEditPrice(idx, val) {
  if (!csvImportTrades[idx]) return;
  const price = parseFloat(val) || 0;
  csvImportTrades[idx].price = price;
  csvImportTrades[idx].amount = Math.round(csvImportTrades[idx].qty * price * 100) / 100;
  recalcCsvFeeTax(csvImportTrades[idx]);
  renderCsvPreview();
}

function recalcCsvFeeTax(trade) {
  trade.fee = Math.round(trade.amount * 0.0001 * 100) / 100;
  trade.tax = trade.direction === 'sell' ? Math.round(trade.amount * 0.0005 * 100) / 100 : 0;
}

function removeCsvTrade(idx) {
  csvImportTrades.splice(idx, 1);
  showToast('已移除 1 条');
  renderCsvPreview();
}

function selectAllCsv() {
  csvImportTrades.forEach(t => t._checked = true);
  renderCsvPreview();
}

function deselectAllCsv() {
  csvImportTrades.forEach(t => t._checked = false);
  renderCsvPreview();
}

function clearCsvImport() {
  csvImportTrades = [];
  document.getElementById('csv-import-area').style.display = 'none';
  document.getElementById('csv-drop-zone').style.display = '';
  document.getElementById('csv-import-result').style.display = 'none';
  showToast('已清空');
}

async function importCsvTrades() {
  const toImport = csvImportTrades.filter(t => t._checked);
  if (toImport.length === 0) { showToast('没有选中的交易'); return; }

  // 校验：数量必须 > 0
  const invalid = toImport.filter(t => !t.qty || t.qty <= 0);
  if (invalid.length > 0) {
    showToast(`❌ ${invalid.length} 条交易数量为 0，请修正后再导入`);
    return;
  }

  if (!confirm(`确认导入 ${toImport.length} 条交易？`)) return;

  // 构造符合后端 add_trades 格式的数据
  const payload = toImport.map(t => ({
    date: t.date, time: t.time, code: t.code, name: t.name,
    direction: t.direction, qty: t.qty, price: t.price,
    amount: t.amount, fee: t.fee || 0, tax: t.tax || 0, balance: ''
  }));

  try {
    showToast('📤 导入中...');
    const res = await fetch('/api/trades', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ trades: payload, skip_dedup: true })
    });
    const result = await res.json();
    if (!res.ok || !('added' in result)) {
      showToast('❌ 导入失败：服务器返回异常');
      return;
    }
    dbLog('write', `CSV导入 → 新增 ${result.added} 条, 跳过 ${result.skipped} 条`);
    showToast(`✅ 导入完成：新增 ${result.added} 条, 跳过(重复) ${result.skipped} 条`);

    // 清空已导入列表，回到拖拽界面
    csvImportTrades = [];
    document.getElementById('csv-import-area').style.display = 'none';
    document.getElementById('csv-drop-zone').style.display = '';

    // 刷新主视图
    loadStats(); loadStocks();
    if (currentTab === 'trades') loadTrades();
  } catch (e) {
    console.error(e);
    showToast('❌ 导入失败');
  }
}
</script>
